[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "stochastic-access-colombia"
version = "0.1.0"
description = "Stochastic accessibility pilot for Bogota and Medellin"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

